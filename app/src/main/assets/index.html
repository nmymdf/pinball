/* ---------- physics ---------- */
function segHit(b,x1,y1,x2,y2,rad,e){
  const dx=x2-x1,dy=y2-y1;let t=((b.x-x1)*dx+(b.y-y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
  const px=x1+dx*t,py=y1+dy*t;let nx=b.x-px,ny=b.y-py;let d=Math.hypot(nx,ny);const rs=R+rad;
  if(d>=rs)return -1;
  if(d<1e-6){nx=-dy;ny=dx;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;d=0;}else{nx/=d;ny/=d;}
  b.x+=nx*(rs-d);b.y+=ny*(rs-d);
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn;}
  return 0;
}
function circHit(b,cx,cy,cr,e){
  const dx=b.x-cx,dy=b.y-cy;const d=Math.hypot(dx,dy),rs=R+cr;if(d>=rs||d<1e-6)return -1;
  const nx=dx/d,ny=dy/d;b.x=cx+nx*rs;b.y=cy+ny*rs;const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn;}return 0;
}
function flipperUpdate(f){
  const target=(f.on&&!tilted)?f.up:f.rest;let na=f.a;const sp=(target===f.up?27:13)*STEP;
  if(na<target)na=Math.min(target,na+sp);else if(na>target)na=Math.max(target,na-sp);
  f.w=(na-f.a)/STEP;f.a=na;
}
function flipperHit(b,f){
  const cs=Math.cos(f.a),sn=Math.sin(f.a);const x1=f.px,y1=f.py,x2=f.px+f.s*f.len*cs,y2=f.py+f.len*sn;
  const dx=x2-x1,dy=y2-y1;let t=((b.x-x1)*dx+(b.y-y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
  const px=x1+dx*t,py=y1+dy*t;const rf=lerp(13,7,t);let nx=b.x-px,ny=b.y-py;let d=Math.hypot(nx,ny);const rs=R+rf;
  if(d>=rs)return;
  if(d<1e-6){nx=0;ny=-1;d=0;}else{nx/=d;ny/=d;}
  b.x+=nx*(rs-d);b.y+=ny*(rs-d);
  const rr=t*f.len;const vsx=f.w*rr*(-f.s*sn),vsy=f.w*rr*cs;
  let rvx=b.vx-vsx,rvy=b.vy-vsy;const vn=rvx*nx+rvy*ny;
  if(vn<0){const e=.3;rvx-=(1+e)*vn*nx;rvy-=(1+e)*vn*ny;b.vx=rvx+vsx;b.vy=rvy+vsy;}
}
function collideBall(b){
  for(let i=0;i<walls.length;i++){const w=walls[i];segHit(b,w.x1,w.y1,w.x2,w.y2,0,w.e);}
  for(const p of posts)circHit(b,p.x,p.y,p.r,.55);
  for(const g of gates){const s=(b.x-g.x1)*g.fx+(b.y-g.y1)*g.fy;if(s>=-1&&b.vx*g.fx+b.vy*g.fy<0)segHit(b,g.x1,g.y1,g.x2,g.y2,0,.2);}
  for(const bp of bumpers){
    const dx=b.x-bp.x,dy=b.y-bp.y,d=Math.hypot(dx,dy),rs=R+bp.r;
    if(d<rs&&d>1e-6){const nx=dx/d,ny=dy/d;b.x=bp.x+nx*rs;b.y=bp.y+ny*rs;const vn=b.vx*nx+b.vy*ny;
      if(vn<0){
        if(tilted){b.vx-=1.4*vn*nx;b.vy-=1.4*vn*ny;}
        else{if(time-(b.bLast||-9)>1.6)b.bN=0;b.bLast=time;b.bN=(b.bN||0)+1;const fl=b.bN>14?2.4:1;const out=Math.max(210,-vn*.38)*fl;const tx=b.vx-vn*nx,ty=b.vy-vn*ny;b.vx=tx*.42+nx*out;b.vy=ty*.42+ny*out;if(b.bN>14)b.bN=0;onBumper(bp);}
      }}
  }
  for(const o of smalls){

function stepPhysics(h){
  for(const f of flips)flipperUpdate(f);

    b.vy+=G*h;const sp=Math.hypot(b.vx,b.vy);if(sp>2300){b.vx*=2300/sp;b.vy*=2300/sp;}
    b.x+=b.vx*h;b.y+=b.vy*h;
    collideBall(b);

    if(!b.held&&b.noCap<=0){
      let cap=false;
      for(const s of saucers){if(Math.hypot(b.x-s.x,b.y-s.y)<13&&Math.hypot(b.vx,b.vy)<1300){onSaucer(s,b);cap=true;break;}}

    if(b.orbCool<=0&&b.vy<-250&&b.y>240&&b.y<290){
      if(b.x<56){onOrbit('L');b.orbCool=1.5;}else if(b.x>512&&b.x<548){onOrbit('R');b.orbCool=1.5;}
    }
    // 上方燈道
    if(b.y>50&&b.y<95&&b.x>170&&b.x<410){const idx=b.x<250?0:(b.x<330?1:2);if(idx!==b.laneIdx){b.laneIdx=idx;laneEnter(idx);}}else if(b.y>=105||b.y<=46)b.laneIdx=-1;
    // 轉轍器
    if(b.x>252&&b.x<316&&b.y>118&&b.y<176&&Math.abs(b.x-284)<17){const v=Math.abs(b.vy)*.05+8;if(v>spinW)spinW=Math.min(v,46);}

    if(z!==b.zone){b.zone=z;if(z>0)zoneEnter(z,b);}
    if(!(b.x>-5&&b.x<TW+5&&b.y>-40)||!isFinite(b.x+b.y+b.vx+b.vy)){b.x=564;b.y=966;b.vx=b.vy=0;say('球回到發球道');continue;}
    if(b.y>1008){drain(b);}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],c=balls[j];if(a.held||c.held)continue;
    const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
    if(d<2*R&&d>1e-6){const nx=dx/d,ny=dy/d,ov=(2*R-d)/2;a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;

  }
}

function update(dt){
  if(paused)return;
  time+=dt;{const ot=trainT;trainT=(trainT+dt*.035)%1.6;if(trainT<ot){trainHit=[false,false,false,false];trainN=0;}}
  for(let i=later.length-1;i>=0;i--){later[i].t-=dt;if(later[i].t<=0){const f=later[i].fn;later.splice(i,1);f();}}
  if(bn){bn.age+=dt;if(bn.age>bn.dur)bn=null;}
  for(let i=fl.length-1;i>=0;i--){fl[i].t+=dt;if(fl[i].t>1.3)fl.splice(i,1);}
  for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)pt.splice(i,1);}
  for(const o of bumpers)if(o.t>0)o.t-=dt;for(const o of smalls)if(o.t>0)o.t-=dt;for(const o of guards)if(o.t>0)o.t-=dt;
  if(state==='play'&&!subMode){
    if(!kbArmed){kbT+=dt;if(kbT>16){kbArmed=true;kbT=0;banner('KICKBACK','左回彈充能完成','#7dffb0',1.3);sfx.skill();}}else kbT=0;
    if(!kbArmedR){kbRT+=dt;if(kbRT>28){kbArmedR=true;kbRT=0;banner('KICKBACK','右回彈充能完成','#7dffb0',1.3);sfx.skill();}}else kbRT=0;
  }
  for(const s of slings)if(s.t>0)s.t-=dt;
  for(const s of stands)if(s.t>0)s.t-=dt;
  for(const s of drops)if(s.t>0)s.t-=dt;
  for(const s of boards)if(s.t>0)s.t-=dt;
  if(spike.cool>0)spike.cool-=dt;if(spike.t>0)spike.t-=dt;
  for(let i=0;i<4;i++)if(inLit[i]>0)inLit[i]-=dt;
  if(sceneMix<1)sceneMix=Math.min(1,sceneMix+dt*.7);
  flash=Math.max(0,flash-dt*2.2);
  shake=Math.max(0,shake-dt*4);shakeX=(Math.random()-.5)*8*shake;shakeY=(Math.random()-.5)*8*shake;
  tilt=Math.max(0,tilt-.9*dt);

  const diff=score-dispScore;if(Math.abs(diff)<=1)dispScore=score;else dispScore+=Math.sign(diff)*Math.max(1,Math.abs(diff)*dt*5);
  const hd=hiScore-hiDisp;if(Math.abs(hd)<=1)hiDisp=hiScore;else hiDisp+=Math.sign(hd)*Math.max(1,Math.abs(hd)*dt*5);
  if(gameOverT>0)gameOverT-=dt;
  if(flips[0].on!==padL){flips[0].on=padL;if(padL&&!tilted&&(state==='play'||state==='launch')){sfx.flip();laneLit.unshift(laneLit.pop());laneLit=laneLit.slice(0,3);}}

  if(state==='launch'&&balls.length===0&&!subMode)spawnLane();
  if(subMode){subUpdate(dt);}
  else if(state==='play'||state==='launch'){
    if(charging)charge=Math.min(1,charge+dt/.9);
    banditUpdate(dt);
    if(state==='play'){
      skillT+=dt;if(skillT>7)skillOn=false;if(ballSaveT>0)ballSaveT-=dt;
      if(superT>0)superT-=dt;if(x2T>0)x2T-=dt;if(chainT>0){chainT-=dt;if(chainT<=0)chain=0;}
      if(act){act.t-=dt;if(act.t<=8&&Math.ceil(act.t)!==act.warn){act.warn=Math.ceil(act.t);if(act.warn>0)sfx.warn();}if(act.t<=0)failMission();}
    }

function recomputePads(){

function kd(e){
  audioInit();syncMods(e);

  const code=keyCode(e);
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Slash','Period'].includes(code))e.preventDefault();
  if(e.repeat)return;
  if(code==='KeyC'||code==='Digit5'){insertCoin();return;}
  if(code==='Enter'||code==='Digit1'||code==='NumpadEnter'){if(state==='attract')startGame();else if(state==='bonus'&&bonusT>1.2)bonusT=Math.max(bonusT,3.35);return;}
  if(code==='KeyP'){paused=!paused;return;}

  if(code==='KeyV'){persp=!persp;buildStrips();return;}
  if(code==='KeyH'){showHelp=true;return;}
  if(code==='KeyF'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(err){}return;}
  if(code==='KeyA'){nudge(-1,0);return;}if(code==='KeyD'){nudge(1,0);return;}if(code==='ArrowUp'||code==='KeyW'){nudge(0,-1);return;}

}

  syncMods(e);

  hl:['【擋板】按住畫面左下／右下的大按鈕，球就會被打出去。','【發射】按住「發射」蓄力，放開就發球。','【搖機】點「搖機」可以推一下球檯，太用力會 TILT。','【目標】打彈跳器、完成任務、把球打進車站，分數越高越好。']},
 en:{start:'START GAME',how:'HOW TO PLAY',au:'Author',ok:'OK',ht:'HOW TO PLAY',
  hl:['Flippers: hold the big buttons at the bottom left / right.','Launch: hold LAUNCH to charge, release to shoot.','Nudge: tap NUDGE to shake the table. Too much causes TILT.','Goal: hit the bumpers, finish missions, shoot into the station.']}};
let lang='en';try{lang=localStorage.getItem('pinball_lang')||(((navigator.language||'').toLowerCase().indexOf('zh')===0)?'zh':'en');}catch(e){}
if(lang!=='zh'&&lang!=='en')lang='en';
const d=document.createElement('div');d.id='home';
d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:#050302;display:none;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
d.innerHTML='<div style="position:absolute;left:-40px;top:-40px;right:-40px;bottom:-40px;background:url('+IMG+') center/cover;filter:blur(24px) brightness(.62)"></div>'
+'<div id="hbox" style="position:absolute"><img id="himg" src="'+IMG+'" style="width:100%;display:block" draggable="false">'
+'<div id="hver" style="position:absolute;left:0;right:0;text-align:center;font-style:italic;font-weight:700;color:#ffd24a;font-family:Georgia,\'Noto Serif TC\',serif;text-shadow:0 2px 0 #4a2a06,0 0 10px #000"></div>'
+'<div id="hstart" style="position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#ffd75e;font-family:\'Noto Serif TC\',\'Songti TC\',\'Noto Sans TC\',serif;text-shadow:0 3px 0 #5a3206,0 0 18px rgba(255,170,50,.75);letter-spacing:.08em"></div>'
+'<div id="hhow" style="position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#fff;letter-spacing:.06em"></div>'
+'<div id="hz1" style="position:absolute;cursor:pointer"></div><div id="hz2" style="position:absolute;cursor:pointer"></div>'
+'<div id="hp1" style="position:absolute;text-align:center;font-weight:800;border-radius:999px;cursor:pointer"></div><div id="hp2" style="position:absolute;text-align:center;font-weight:800;border-radius:999px;cursor:pointer"></div></div>'
+'<div id="hhelp" style="position:absolute;left:0;top:0;right:0;bottom:0;display:none;background:rgba(0,0,0,.82);align-items:center;justify-content:center"><div id="hcard" style="width:86%;max-width:420px;border:3px solid #d4af37;border-radius:20px;background:linear-gradient(#1c120a,#0a0604);padding:22px 20px;color:#f3e6c4;box-shadow:0 0 40px rgba(255,170,50,.4)"></div></div>';
document.body.appendChild(d);
const $=id=>d.querySelector('#'+id);
function pill(el,on,txt,u){el.textContent=txt;el.style.whiteSpace='nowrap';el.style.overflow='hidden';el.style.fontSize=(34*u)+'px';el.style.lineHeight=(78*u)+'px';el.style.height=(84*u)+'px';el.style.width=(196*u)+'px';el.style.border=(4*u)+'px solid #c9972f';
  el.style.background=on?'linear-gradient(#f5d268,#d19a24)':'linear-gradient(#14100a,#050403)';el.style.color=on?'#2a1804':'#f3dfa8';}
function layout(){const W=innerWidth,H=innerHeight;const bw=Math.min(W,H/1.5),bh=bw*1.5,u=bw/1024;const b=$('hbox');
  b.style.width=bw+'px';b.style.height=bh+'px';b.style.left=((W-bw)/2)+'px';b.style.top=((H-bh)/2)+'px';
  const t=TXT[lang];const place=(el,cy,fs)=>{el.style.whiteSpace='nowrap';el.style.top=(cy*u-fs*u*.62)+'px';el.style.fontSize=(fs*u)+'px';el.style.lineHeight=(fs*u*1.24)+'px';};
  const v=$('hver');v.textContent=t.au+' · '+VERSION;place(v,268,46);
  const s=$('hstart');s.textContent=t.start;place(s,1150,lang==='zh'?82:68);
  const h=$('hhow');h.textContent=t.how;place(h,1305,lang==='zh'?52:46);
  const z=(id,x0,y0,x1,y1)=>{const e=$(id);e.style.left=(x0*u)+'px';e.style.top=(y0*u)+'px';e.style.width=((x1-x0)*u)+'px';e.style.height=((y1-y0)*u)+'px';};
  z('hz1',170,1058,855,1240);z('hz2',205,1255,820,1358);
  const p1=$('hp1'),p2=$('hp2');pill(p1,lang==='zh','繁體中文',u);pill(p2,lang==='en','English',u);
  p1.style.left=(302*u)+'px';p2.style.left=(526*u)+'px';p1.style.top=p2.style.top=(1378*u)+'px';
}
function setLang(l){lang=l;try{localStorage.setItem('pinball_lang',l);}catch(e){}layout();}
function showHelpCard(){const t=TXT[lang];const c=$('hcard');c.innerHTML='<div style="font:900 24px/1.2 sans-serif;color:#ffd75e;text-align:center;margin-bottom:12px">'+t.ht+'</div>'
  +t.hl.map(x=>'<div style="font:600 17px/1.5 sans-serif;margin:9px 0">'+x+'</div>').join('')
  +'<div id="hok" style="margin-top:16px;padding:12px 0;text-align:center;font:800 20px sans-serif;border-radius:14px;background:linear-gradient(#f5d268,#d19a24);color:#2a1804">'+t.ok+'</div>';
  $('hhelp').style.display='flex';c.querySelector('#hok').onclick=()=>{$('hhelp').style.display='none';};}
d.addEventListener('click',e=>{try{
  const el=e.target.id;if(el==='hp1'){setLang('zh');return;}if(el==='hp2'){setLang('en');return;}
  if(el==='hz1'){if(typeof audioInit==='function')audioInit();d.style.display='none';if(credits<1)insertCoin();startGame();return;}
  if(el==='hz2'){if(typeof audioInit==='function')audioInit();showHelpCard();return;}
}catch(err){}});
d.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',layout);layout();
setInterval(function(){try{const want=MOB&&state==='attract';const cur=d.style.display!=='none';if(want&&!cur){layout();d.style.display='block';$('hhelp').style.display='none';}else if(!want&&cur)d.style.display='none';}catch(e){}},200);
}catch(err){try{console.error(err);}catch(e){}}})();
