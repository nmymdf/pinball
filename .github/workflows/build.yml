name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pinball-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the apk branch
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/Pinball.apk
          cd out
          git init -b apk
          git add Pinball.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "Built APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
